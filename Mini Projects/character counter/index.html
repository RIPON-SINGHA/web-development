<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="title">Character Counter App</div>

      <div class="textarea">
        <textarea name="input-field" id="input-field"></textarea>
      </div>

      <button class="submitBtn">Sumbit</button>

      <div class="character-counter">0 characters</div>
    </div>

    <div class="popup hidden">
        <div class="upperPart">Confirmation</div>
        <div class="middlePart">Your input has been successfully submitted...
        </div>
        <div class="lowerPart">
            <button class="confirmBtn">OK</button>
        </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
