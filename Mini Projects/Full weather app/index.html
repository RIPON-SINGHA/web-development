<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app_container">
      <div class="weather_container">
        <div class="main_weather_card">
          <div class="location_place">
            <span class="location_name">No city</span>
            <span class="your_location_span">Your Location</span>
          </div>

          <div class="date_time">
            <span class="show_date_day">None,</span>
            <span class="show_date">None</span>
            <span class="show_date_month">None</span>

            <span class="separator">.</span>

            <span class="show_time">00:00</span>
            <span class="day_night_indication">AM</span>
            <span class="show_timezone">None</span>
          </div>

          <div class="main_city_current_temp">0°C</div>
          <div class="weather_description">None</div>

          <hr />

          <div class="other_weather_data">
            <div class="show_humidity">
              <p class="humidity_level">0%</p>
              <p class="humidity_title">Humidity</p>
            </div>

            <div class="show_wind">
              <p class="wind_level">00 km/h</p>
              <p class="wind_title">Wind</p>
            </div>
          </div>
        </div>
      </div>

      <div class="input_container">
        <input type="text" class="city_input" placeholder="Search for city" />
        <button class="fetch_weather_data">Search Weather</button>
      </div>

      <span class="searched_city_title">No searched cities</span>

      <div class="search_weather_container">
      </div>
    </div>
    

    <script src="app.js"></script>
  </body>
</html>
