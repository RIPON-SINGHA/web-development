<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app_container">
      <div class="weather_container">
        <div class="main_weather_card">
          <div class="location_place">
            <span class="location_name">Kolkata</span>
            <span class="your_location_span">Your Location</span>
          </div>

          <div class="date_time">
            <span class="show_date_day">sun,</span>
            <span class="show_date">56</span>
            <span class="show_date_month">Jan</span>

            <span class="separator">.</span>

            <span class="show_time">3:34</span>
            <span class="day_night_indication">AM</span>
            <span class="show_timezone">IjgtfhST</span>
          </div>

          <div class="main_city_current_temp">31°C</div>
          <div class="weather_description">Partly cloudy</div>

          <hr />

          <div class="other_weather_data">
            <div class="show_humidity">
              <p class="humidity_level">72%</p>
              <p class="humidity_title">Humidity</p>
            </div>

            <div class="show_wind">
              <p class="wind_level">14 km/h</p>
              <p class="wind_title">Wind</p>
            </div>
          </div>
        </div>
      </div>

      <div class="input_container">
        <input type="text" class="city_input" placeholder="Search for city" />
        <button class="fetch_weather_data">Search Weather</button>
      </div>

      <span class="searched_city_title">Searched cities</span>

      <div class="search_weather_container">
        <div class="searched_weather_1 searched_weather">
          <div class="searched_place_time_other_weather_data">
            <span class="place_name">Tokyo</span>

            <p class="show_country_time">
              <span class="country">Japan</span>
              <span class="saperator">.</span>
              <span class="time">11:42</span>
              <span class="day-night_indicator">PM</span>
              <span class="searched_timezone">JST</span>
            </p>

            <p class="show_humidity_wind">
              <span class="searched_humidity">65% H</span>
              <span class="searched_wind">9km/h W</span>
            </p>
          </div>

          <div class="searched_city_temp">
            24°C
            <p class="searched_weather_description">clear</p>
          </div>
          <div class="close_btn">✕</div>
        </div>
        <div class="searched_weather_2 searched_weather">
          <div class="searched_place_time_other_weather_data">
            <span class="place_name">Tokyo</span>

            <p class="show_country_time">
              <span class="country">Japan</span>
              <span class="saperator">.</span>
              <span class="time">11:42</span>
              <span class="day-night_indicator">PM</span>
              <span class="searched_timezone">JST</span>
            </p>

            <p class="show_humidity_wind">
              <span class="searched_humidity">65% H</span>
              <span class="searched_wind">9km/h W</span>
            </p>
          </div>

          <div class="searched_city_temp">
            24°C
            <p class="searched_weather_description">clear</p>
          </div>

          <div class="close_btn">✕</div>
        </div>
        <div class="searched_weather_2 searched_weather">
          <div class="searched_place_time_other_weather_data">
            <span class="place_name">Tokyo</span>

            <p class="show_country_time">
              <span class="country">Japan</span>
              <span class="saperator">.</span>
              <span class="time">11:42</span>
              <span class="day-night_indicator">PM</span>
              <span class="searched_timezone">JST</span>
            </p>

            <p class="show_humidity_wind">
              <span class="searched_humidity">65% H</span>
              <span class="searched_wind">9km/h W</span>
            </p>
          </div>

          <div class="searched_city_temp">
            24°C
            <p class="searched_weather_description">clear</p>
          </div>
          <div class="close_btn">✕</div>
        </div>
      </div>
    </div>
    

    <script src="app.js"></script>
  </body>
</html>
