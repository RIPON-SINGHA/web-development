<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes app v1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- STATE 1: Empty -->
  <div class="app-container">
    <div class="topbar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="note-icon-small" viewBox="0 0 16 16">
        <path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2"/>
        <path d="M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1z"/>
      </svg>
      <p class="topbar-title">Notes</p>
      <button class="topbar-btn create-note-button">+ new note</button>
    </div>
    <div class="empty-panel">
      <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="note-icon" viewBox="0 0 16 16">
        <path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2"/>
        <path d="M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1z"/>
      </svg>
      <p class="empty-title">No notes yet</p>
      <p class="empty-sub">Click "+ New note" to start writing something.</p>
      <button class="empty-btn create-note-button">+ new note</button>
    </div>
  </div>

  <!-- STATE 2 -->

  <div class="main-app-container">
    <div class="topbar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="note-icon-small" viewBox="0 0 16 16">
        <path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2"/>
        <path d="M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1z"/>
      </svg>
        <p class="topbar-title">Notes</p>
        <svg class="search-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="#000000"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><title>ionicons-v5-f</title><path d="M221.09,64A157.09,157.09,0,1,0,378.18,221.09,157.1,157.1,0,0,0,221.09,64Z" style="fill:none;stroke:#000000;stroke-miterlimit:10;stroke-width:32px"></path><line x1="338.29" y1="338.29" x2="448" y2="448" style="fill:none;stroke:#000000;stroke-linecap:round;stroke-miterlimit:10;stroke-width:32px"></line></g></svg>
        <input type="text" class="search-note">
        <button class="topbar-btn create-note-button">+ new note</button>
        <span class="change-theme">☀️</span>

    </div>
    <div class="main-app-panel">
        <div class="note-list-container">
            <div class="list-number">4 Notes</div>
            <div class="note-list">
                <p class="note-indicator-title">dasdwdaswdasadawds da wd aadwdsef</p>
                <span class="pinned"></span>
            </div>
            <div class="note-list">
                <p class="note-indicator-title">dasdwd aswdasa dawds da wd aadwdsef</p>
            </div>
            <div class="note-list">
                <p class="note-indicator-title">dasdwdaswdasadawds da wd aadwdsef</p>
            </div>
            <div class="note-list">
                <p class="note-indicator-title">dasdwdaswdasadawds da wd aadwdsef</p>
            </div>
        </div>
        <div class="note-editor-panel">
            <div class="editor-topbar">
                <input class="note-title" value="This is a note" placeholder="No title" />
                <span class="character-count"> 0 Characters , 0 Words </span>
                <div class="vertical-line-saperator"></div>
                <button class="exportBtn">Export</button>
                <div class="vertical-line-saperator"></div>
                <button class="delete-note">Delete Note</button>
            </div>
            <textarea name="note-editor" class="editor-textarea" placeholder="start writing here"></textarea>
            <div class="last-saved-time">last saved today at <span class="last-saved-time-indicator">4:30</span></div>
        </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
